volumes:
  mongo_data:

services:
  mongo_db:
    image: mongo:latest
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: mongo_admin
      MONGO_INITDB_ROOT_PASSWORD: password
      MONGO_INITDB_DATABASE: books
    volumes:
      - mongo_data:/data/db
    ports:
      - "27017:27017"

  fastapi_app:
    build: .
    container_name: fastapi_app
    command: uvicorn run:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    depends_on:
      - mongo_db
    environment:
      - MONGO_URI=mongodb://mongo_admin:password@mongo_db:27017

